# ──────────────────────────────────────────────────────────────
# SonarQube Project Configuration
# Static Application Security Testing (SAST) & Quality Gates
# ──────────────────────────────────────────────────────────────
sonar.projectKey=devops-app
sonar.projectName=DevOps Express Microservice
sonar.projectVersion=1.0.0

# Source & Inclusions
sonar.sources=.
sonar.inclusions=app.js,db.js,index.js

# Exclusions (Avoid scanning libraries and generated code)
sonar.exclusions=node_modules/**,devops_tools/**,coverage/**,**/*.test.js,**/*.spec.js

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript Analyzer settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
