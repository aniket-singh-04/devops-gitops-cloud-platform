# ──────────────────────────────────────────────────────────────
# ArgoCD Application
# Defines what to deploy, where to deploy, and how to sync
# ArgoCD watches the devops_tools/k8s/ directory in Git and automatically
# syncs any changes to the K3s cluster (GitOps workflow)
# ──────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app
  namespace: argocd
  # Finalizer ensures ArgoCD cleans up resources on app deletion
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Link this Application to our project (for RBAC scoping)
  project: devops-project

  # ────────────── Source — where to read manifests from ──────────────
  source:
    repoURL: https://github.com/aniket-singh-04/Complete-deployment.git
    targetRevision: main
    path: devops_tools/k8s   # Directory containing Kubernetes manifests

  # ────────────── Destination — where to deploy ──────────────
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app

  # ────────────── Sync Policy — how to keep in sync ──────────────
  syncPolicy:
    # Automated sync — ArgoCD applies changes without manual approval
    automated:
      prune: true            # Delete resources removed from Git
      selfHeal: true         # Revert manual changes made on cluster
      allowEmpty: false      # Prevent syncing if all manifests are removed

    # Sync options for safe deployments
    syncOptions:
      - CreateNamespace=true          # Create namespace if missing
      - PrunePropagationPolicy=foreground  # Wait for dependents on delete
      - PruneLast=true                # Prune after all other syncs complete

    # Retry on sync failure
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
