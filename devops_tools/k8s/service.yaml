# ──────────────────────────────────────────────────────────────
# Service
# Exposes the application pods within the cluster
# Traefik Ingress (K3s default) routes external traffic here
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: devops-app-svc
  namespace: devops-app
  labels:
    app: devops-app
spec:
  type: ClusterIP
  selector:
    app: devops-app
  ports:
    - name: http
      port: 80               # Service port (what other pods use)
      targetPort: 4444        # Container port (where the app listens)
      protocol: TCP
