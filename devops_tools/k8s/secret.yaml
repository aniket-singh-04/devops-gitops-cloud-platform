# ──────────────────────────────────────────────────────────────
# Secret — Database Credentials
# Stores sensitive MongoDB Atlas connection URI
# NOTE: In enterprise production environments, use HashiCorp Vault,
# AWS Secrets Manager with External Secrets Operator, or SealedSecrets
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: devops-app
  labels:
    app: devops-app
type: Opaque
stringData:
  # Example URI template — replace with your actual Atlas connection string
  # Format: mongodb+srv://<username>:<password>@<cluster-host>/<database>?retryWrites=true&w=majority
  MONGO_URI: "mongodb+srv://app_user:YourStrongPassword@cluster0.mongodb.net/devops_db?retryWrites=true&w=majority"
