# ──────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler
# Automatically scales pods based on CPU utilization
# Requires metrics-server (included in K3s by default)
# ──────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-app-hpa
  namespace: devops-app
  labels:
    app: devops-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # Scale up when CPU exceeds 70%
