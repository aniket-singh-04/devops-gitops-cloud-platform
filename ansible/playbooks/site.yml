# ──────────────────────────────────────────────────────────────
# Site Playbook — Main Entry Point
# Orchestrates the full K3s cluster setup in the correct order
# Usage: ansible-playbook playbooks/site.yml
# ──────────────────────────────────────────────────────────────
---
- name: Apply common configuration to all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Setup K3s master node
  hosts: k3s_master
  become: true
  roles:
    - k3s-master

- name: Join K3s worker nodes to the cluster
  hosts: k3s_workers
  become: true
  roles:
    - k3s-worker
