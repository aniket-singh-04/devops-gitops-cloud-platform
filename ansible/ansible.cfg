# ──────────────────────────────────────────────────────────────
# Ansible Configuration
# Project-level settings for all playbooks and roles
# ──────────────────────────────────────────────────────────────

[defaults]
# Inventory file location
inventory = inventory/hosts.ini

# SSH user for EC2 Ubuntu instances
remote_user = ubuntu

# Disable host key checking for fresh EC2 instances
host_key_checking = False

# Path to roles directory
roles_path = roles

# Retry files clutter the repo — disable them
retry_files_enabled = False

# Increase default timeout for slow cloud operations
timeout = 30

# Reduce unnecessary output
deprecation_warnings = False

[privilege_escalation]
# Most server setup tasks require root privileges
become = True
become_method = sudo
become_user = root

[ssh_connection]
# Speed up SSH connections with pipelining
pipelining = True

# SSH arguments for stable connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
