# ──────────────────────────────────────────────────────────────
# K3s Master Role — Tasks
# Installs K3s server and retrieves the join token for workers
# ──────────────────────────────────────────────────────────────
---
- name: Open K3s API server port (6443)
  ufw:
    rule: allow
    port: '6443'
    proto: tcp
  tags: [firewall]

- name: Open Flannel VXLAN port (8472)
  ufw:
    rule: allow
    port: '8472'
    proto: udp
  tags: [firewall]

- name: Open Kubelet port (10250)
  ufw:
    rule: allow
    port: '10250'
    proto: tcp
  tags: [firewall]

- name: Open HTTP port (80)
  ufw:
    rule: allow
    port: '80'
    proto: tcp
  tags: [firewall]

- name: Open HTTPS port (443)
  ufw:
    rule: allow
    port: '443'
    proto: tcp
  tags: [firewall]

- name: Open NodePort range (30000-32767)
  ufw:
    rule: allow
    port: '30000:32767'
    proto: tcp
  tags: [firewall]

- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s server
  shell: |
    curl -sfL https://get.k3s.io | sh -s - server \
      --write-kubeconfig-mode 644 \
      --tls-san {{ ansible_host }} \
      --node-name k3s-master
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists
  notify: restart k3s

- name: Wait for K3s to be ready
  command: k3s kubectl get nodes
  register: k3s_ready
  retries: 15
  delay: 10
  until: k3s_ready.rc == 0
  changed_when: false

- name: Read K3s join token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Store K3s join token as fact (shared with worker nodes)
  set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
    k3s_master_ip: "{{ ansible_default_ipv4.address }}"

- name: Copy kubeconfig to ubuntu user home
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  notify: update kubeconfig server address

- name: Ensure .kube directory exists
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
