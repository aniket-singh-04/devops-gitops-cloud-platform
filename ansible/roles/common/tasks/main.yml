# ──────────────────────────────────────────────────────────────
# Common Role — Tasks
# Base packages and system hardening applied to ALL nodes
# ──────────────────────────────────────────────────────────────
---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [packages]

- name: Upgrade all system packages
  apt:
    upgrade: dist
    autoremove: yes
  tags: [packages]

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - net-tools
      - jq
      - htop
    state: present
  tags: [packages]

- name: Set timezone to Asia/Kolkata
  timezone:
    name: Asia/Kolkata
  tags: [system]

- name: Disable swap (required for Kubernetes)
  command: swapoff -a
  changed_when: false
  tags: [system]

- name: Remove swap entry from fstab (persist across reboots)
  lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent
  tags: [system]

- name: Load required kernel modules for Kubernetes networking
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  tags: [system]

- name: Persist kernel modules across reboots
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'
  tags: [system]

- name: Set sysctl parameters for Kubernetes networking
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: yes
  loop:
    - { key: 'net.bridge.bridge-nf-call-iptables',  value: '1' }
    - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { key: 'net.ipv4.ip_forward',                 value: '1' }
  tags: [system]

- name: Configure UFW to allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp
  tags: [firewall]

- name: Enable UFW with default deny incoming
  ufw:
    state: enabled
    default: deny
    direction: incoming
  tags: [firewall]
