# ──────────────────────────────────────────────────────────────
# K3s Worker Role — Handlers
# Triggered actions that only run when notified by a task
# ──────────────────────────────────────────────────────────────
---
- name: restart k3s-agent
  systemd:
    name: k3s-agent
    state: restarted
    daemon_reload: yes
