services:
  app:
    image: ${IMAGE_NAME:-my_app}:${IMAGE_TAG:-v1.0.0}

    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    container_name: ${CONTAINER_NAME:-express-app}

    restart: unless-stopped

    ports:
      - "4444:4444"

    env_file:
      - path: .env
        required: false

    environment: # Dynamic environment variables loaded from .env or system env
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4444}
      - MONGO_URI=${MONGO_URI:-}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4444/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s